<div class="p-6 space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between gap-3 flex-wrap">
    <div class="flex items-center gap-3">
      <div class="p-2.5 bg-violet-100 rounded-xl">
        <lucide-icon [img]="WalletIcon" class="w-5 h-5 text-violet-600" />
      </div>
      <div>
        <h1 class="text-xl font-bold text-slate-800">Tesorería</h1>
        <p class="text-sm text-slate-500">Contabilidad de casos y cotejo con el banco</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" (click)="showCuentasDrawer.set(true)"
        class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium border border-slate-200 text-slate-700 rounded-lg hover:bg-slate-50">
        <lucide-icon [img]="SettingsIcon" class="w-4 h-4" />
        Cuentas
      </button>
      <button type="button" (click)="showCierreModal.set(true)"
        class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium bg-violet-600 text-white rounded-lg hover:bg-violet-700 transition-colors">
        <lucide-icon [img]="LockIcon" class="w-4 h-4" />
        Cierre de caja
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex gap-1 border-b border-slate-200">
    <button type="button"
      (click)="activeTab.set('resumen')"
      class="px-4 py-2 text-sm font-medium rounded-t-lg transition-colors"
      [class]="activeTab() === 'resumen'
        ? 'bg-white border border-b-white border-slate-200 text-violet-700 -mb-px'
        : 'text-slate-500 hover:text-slate-700'">
      Resumen
    </button>
    <button type="button"
      (click)="activeTab.set('movimientos')"
      class="px-4 py-2 text-sm font-medium rounded-t-lg transition-colors"
      [class]="activeTab() === 'movimientos'
        ? 'bg-white border border-b-white border-slate-200 text-violet-700 -mb-px'
        : 'text-slate-500 hover:text-slate-700'">
      Movimientos
      @if (movimientosPendientes() > 0) {
        <span class="ml-1.5 inline-flex items-center justify-center w-4 h-4 text-xs rounded-full bg-amber-400 text-white font-semibold">{{ movimientosPendientes() }}</span>
      }
    </button>
    <button type="button"
      (click)="activeTab.set('conciliacion')"
      class="px-4 py-2 text-sm font-medium rounded-t-lg transition-colors"
      [class]="activeTab() === 'conciliacion'
        ? 'bg-white border border-b-white border-slate-200 text-violet-700 -mb-px'
        : 'text-slate-500 hover:text-slate-700'">
      Conciliación
    </button>
    <button type="button"
      (click)="activeTab.set('reportes')"
      class="px-4 py-2 text-sm font-medium rounded-t-lg transition-colors"
      [class]="activeTab() === 'reportes'
        ? 'bg-white border border-b-white border-slate-200 text-violet-700 -mb-px'
        : 'text-slate-500 hover:text-slate-700'">
      Reportes
    </button>
    <button type="button"
      (click)="activeTab.set('casos')"
      class="px-4 py-2 text-sm font-medium rounded-t-lg transition-colors"
      [class]="activeTab() === 'casos'
        ? 'bg-white border border-b-white border-slate-200 text-violet-700 -mb-px'
        : 'text-slate-500 hover:text-slate-700'">
      Casos
    </button>
  </div>

  <!-- Tab content -->
  @switch (activeTab()) {
    @case ('resumen') {
      <app-tesoreria-resumen-tab
        [cotejos]="cotejosPorCuenta()"
        [movimientosPorCuenta]="movimientosPorCuenta()"
        [resumenHistorico]="resumenHistorico()"
        [hayCuentas]="cuentas().length > 0"
        [cotejo]="cotejo()"
        [saldoBancarioInput]="saldoBancarioInput()"
        [savingSaldo]="savingSaldo()"
        [saldoBancarioFecha]="saldoBancarioFecha()"
        [cierres]="cierres()"
        (actualizarSaldoCuenta)="actualizarSaldoCuenta($event.cuentaId, $event.valor)"
        (guardarSaldoBancario)="guardarSaldoBancario($event)"
      />
    }
    @case ('movimientos') {
      <app-revision-movimientos [conciliado]="todoConciliado()" />
    }
    @case ('conciliacion') {
      <app-conciliacion-tab
        [cuentas]="cuentas()"
        [lineas]="lineasExtracto()"
        [movimientos]="movimientosConciliables()"
        [importando]="importandoExtracto()"
        (importarCsv)="onImportarCsv($event)"
        (autoConciliar)="onAutoConciliar($event)"
        (casar)="onCasar($event)"
        (desconciliar)="onDesconciliar($event)"
        (ignorar)="onIgnorarLinea($event)"
      />
    }
    @case ('reportes') {
      <app-reportes-tab
        [reporte]="reporte()"
        [desde]="rangoDesde()"
        [hasta]="rangoHasta()"
        (desdeChange)="rangoDesde.set($event)"
        (hastaChange)="rangoHasta.set($event)"
        (exportar)="exportarCsv()"
      />
    }
    @case ('casos') {
      <app-tesoreria-casos-tab
        [casosContables]="casosContables()"
        [resumenPorCaso]="resumenPorCaso()"
        [balanceGeneral]="balanceGeneral()"
        [totalEgresos]="totalEgresos()"
        [saldoAprobado]="saldoAprobado()"
        [proyeccionBancaria]="proyeccionBancaria()"
        [loading]="loading()"
        (casoSeleccionado)="selectedCaso.set($event)"
      />
    }
  }

</div>

<!-- Drawers -->
<app-tesoreria-caso-drawer [caso]="selectedCaso()" (closed)="selectedCaso.set(null)" />

@if (showCuentasDrawer()) {
  <app-cuentas-drawer (closed)="showCuentasDrawer.set(false)" />
}

@if (showCierreModal()) {
  <app-cierre-caja-modal
    [cuentas]="cierrePreview()"
    [saving]="savingCierre()"
    (confirmed)="realizarCierre($event)"
    (closed)="showCierreModal.set(false)"
  />
}
