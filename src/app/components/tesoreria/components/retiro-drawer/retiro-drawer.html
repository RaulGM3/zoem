<div class="fixed inset-0 z-50 flex justify-end">
  <div class="absolute inset-0 bg-black/40" (click)="closed.emit()" aria-hidden="true"></div>
  <div class="relative flex flex-col w-full max-w-md shadow-2xl"
    style="background:var(--surface);border-left:1px solid var(--border)"
    role="dialog" aria-label="Retirar honorarios">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 shrink-0" style="border-bottom:1px solid var(--border)">
      <div>
        <h2 class="text-base font-semibold" style="color:var(--text-strong);font-family:var(--font-display)">Retirar honorarios</h2>
        <p class="text-xs mt-0.5" style="color:var(--text-muted)">Retiro de fondos independiente de un caso</p>
      </div>
      <button type="button" (click)="closed.emit()"
        class="rounded-xl p-1.5 transition-colors duration-150"
        style="color:var(--text-muted)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''">
        <lucide-icon [img]="XIcon" class="size-5"></lucide-icon>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto p-6 space-y-4">
      <div>
        <label class="form-label">Concepto *</label>
        <input type="text" placeholder="Ej. Retiro honorarios Q2 2025"
          class="form-input"
          [ngModel]="form().concepto" (ngModelChange)="form.update(f => ({...f, concepto: $event}))" />
      </div>
      <div>
        <label class="form-label">Importe (€) *</label>
        <input type="number" min="0.01" step="0.01" placeholder="0,00"
          class="form-input"
          [ngModel]="form().importe" (ngModelChange)="form.update(f => ({...f, importe: $event}))" />
      </div>
      <div>
        <label class="form-label">Fecha *</label>
        <input type="date"
          class="form-input"
          [ngModel]="form().fecha" (ngModelChange)="form.update(f => ({...f, fecha: $event}))" />
      </div>
      @if (cuentas().length > 0) {
        <div>
          <label class="form-label">Cuenta / Caja</label>
          <select class="form-select"
            [ngModel]="form().cuentaId" (ngModelChange)="form.update(f => ({...f, cuentaId: $event}))">
            <option value="">Sin asignar</option>
            @for (c of cuentas(); track c.id) {
              <option [value]="c.id">{{ c.nombre }}{{ c.entidad ? ' · ' + c.entidad : '' }}</option>
            }
          </select>
        </div>
      }
      <div>
        <label class="form-label">Notas</label>
        <textarea rows="3" placeholder="Observaciones opcionales..."
          class="form-input resize-none"
          [ngModel]="form().notas" (ngModelChange)="form.update(f => ({...f, notas: $event}))"></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-2 px-6 py-4 shrink-0" style="border-top:1px solid var(--border)">
      <button type="button" (click)="closed.emit()"
        class="px-4 py-2 text-sm rounded-xl transition-colors duration-150"
        style="color:var(--text-body)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''">
        Cancelar
      </button>
      <button type="button" (click)="save()"
        [disabled]="saving() || !form().concepto.trim() || !form().importe"
        class="px-5 py-2 text-sm font-semibold text-white rounded-xl disabled:opacity-40 transition-all duration-150"
        style="background:var(--brand)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--brand-hover)'"
        (mouseleave)="$any($event.currentTarget).style.background='var(--brand)'">
        {{ saving() ? 'Guardando...' : 'Registrar retiro' }}
      </button>
    </div>
  </div>
</div>
