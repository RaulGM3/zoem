@if (caso(); as c) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-black/30 z-40"
    (click)="closed.emit()"
    aria-hidden="true"
  ></div>

  <!-- Panel -->
  <aside
    class="fixed right-0 top-0 h-full w-full max-w-2xl z-50 flex flex-col shadow-2xl"
    style="background:var(--bg);border-left:1px solid var(--border)"
    role="dialog"
    [attr.aria-label]="'Gestoría de ' + c.titulo"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 shrink-0"
      style="background:var(--surface);border-bottom:1px solid var(--border)">
      <div>
        <h2 class="text-base font-semibold" style="color:var(--text-strong);font-family:var(--font-display)">{{ c.titulo }}</h2>
        <p class="text-xs mt-0.5" style="color:var(--text-muted)">Gestoría del caso</p>
      </div>
      <button type="button" (click)="closed.emit()"
        class="rounded-xl p-1.5 transition-colors duration-150"
        style="color:var(--text-muted)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''"
        aria-label="Cerrar">
        <lucide-icon [img]="XIcon" class="w-5 h-5" />
      </button>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-y-auto p-5">
      <app-caso-gestoria-tab
        [slots]="slots()"
        [movimientos]="movimientos()"
        [movimientosLoading]="movimientosLoading()"
        [resumen]="resumen()"
        (addMov)="openMovForm()"
        (deleteMov)="onDeleteMov($event)"
        (registerSlot)="onRegisterSlot($event)"
        (unregisterSlot)="onUnregisterSlot($event)"
        (reorderSlots)="onReorderSlots($event)"
      />
    </div>
  </aside>

  <!-- Movimiento form drawer -->
  <app-movimiento-form-drawer
    [visible]="showMovForm()"
    [saving]="savingMov()"
    [prefillSlot]="prefillSlot()"
    [cuentas]="cuentas()"
    (saved)="onSaveMov($event)"
    (closed)="showMovForm.set(false)"
  />
}
