@if (caso(); as c) {
  <app-overlay-shell [open]="true" [title]="c.titulo" variant="drawer" (closed)="closed.emit()">
    <div class="px-4 py-5 sm:px-5" style="background:var(--bg)">
      <p class="mb-4 text-xs" style="color:var(--text-muted)">Gestoría del caso</p>
      <app-caso-gestoria-tab
        [slots]="slots()"
        [movimientos]="movimientos()"
        [movimientosLoading]="movimientosLoading()"
        [resumen]="resumen()"
        (addMov)="openMovForm()"
        (deleteMov)="onDeleteMov($event)"
        (registerSlot)="onRegisterSlot($event)"
        (unregisterSlot)="onUnregisterSlot($event)"
        (reorderSlots)="onReorderSlots($event)"
      />
    </div>
  </app-overlay-shell>

  <!-- Movimiento form drawer -->
  <app-movimiento-form-drawer
    [visible]="showMovForm()"
    [saving]="savingMov()"
    [prefillSlot]="prefillSlot()"
    [cuentas]="cuentas()"
    (saved)="onSaveMov($event)"
    (closed)="showMovForm.set(false)"
  />
}
