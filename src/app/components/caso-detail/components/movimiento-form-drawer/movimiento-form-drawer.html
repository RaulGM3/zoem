@if (visible()) {
  <div class="fixed inset-0 z-40 bg-black/30" (click)="closed.emit()" aria-hidden="true"></div>
  <aside class="fixed right-0 top-0 h-full w-full max-w-sm shadow-2xl z-50 flex flex-col" style="background:var(--surface)"
    role="dialog" aria-modal="true" aria-labelledby="mov-drawer-title">
    <div class="flex items-center justify-between px-6 py-4" style="border-bottom:1px solid var(--border)">
      <h2 id="mov-drawer-title" class="text-base font-semibold" style="color:var(--text-strong);font-family:var(--font-display)">Nuevo movimiento</h2>
      <button (click)="closed.emit()"
        class="p-1.5 rounded-lg transition-colors duration-150"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''"
        aria-label="Cerrar">
        <lucide-icon [img]="XIcon" class="w-4 h-4" style="color:var(--text-faint)" />
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-4">
      <div class="space-y-1">
        <label class="form-label">Concepto <span style="color:var(--danger)">*</span></label>
        <input type="text" [value]="formConcepto()" (input)="formConcepto.set($any($event.target).value)"
          placeholder="Ej. Provisión de fondos"
          class="form-input" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="form-label">Tipo</label>
          <select (change)="onTipoChange($any($event.target).value)" class="form-select">
            @for (t of tipos; track t) { <option [value]="t" [selected]="formTipo() === t">{{ t }}</option> }
          </select>
        </div>
        <div class="space-y-1">
          <label class="form-label">Importe total (€) <span style="color:var(--danger)">*</span></label>
          <input type="number" min="0" step="0.01" [value]="formImporte()" (input)="formImporte.set($any($event.target).value)" class="form-input" />
        </div>
      </div>
      <div class="space-y-1">
        <label class="form-label">IVA</label>
        <select (change)="formIva.set($any($event.target).value)" class="form-select">
          @for (o of ivaOpciones; track o) {
            <option [value]="o" [selected]="formIva() === o">{{ o === 'exento' ? 'Exento / No sujeto' : o + '%' }}</option>
          }
        </select>
        @if (formImporte() && desglose().baseImponible > 0) {
          <div class="flex justify-between text-xs pt-1" style="color:var(--text-muted)">
            <span>Base imponible: <span class="font-medium" style="color:var(--text-body)">{{ desglose().baseImponible | number:'1.2-2' }} €</span></span>
            <span>Cuota IVA: <span class="font-medium" style="color:var(--text-body)">{{ desglose().cuotaIva | number:'1.2-2' }} €</span></span>
          </div>
        }
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="form-label">Dirección</label>
          <select (change)="formEsEntrada.set($any($event.target).value === 'true')" class="form-select">
            <option value="true" [selected]="formEsEntrada()">Entrada (cobrado)</option>
            <option value="false" [selected]="!formEsEntrada()">Salida (pagado)</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="form-label">Fecha</label>
          <input type="date" [value]="formFecha()" (input)="formFecha.set($any($event.target).value)" class="form-input" />
        </div>
      </div>
      @if (cuentas().length > 0) {
        <div class="space-y-1">
          <label class="form-label">Cuenta / Caja <span style="color:var(--danger)">*</span></label>
          <select [value]="formCuentaId()" (change)="formCuentaId.set($any($event.target).value)" class="form-select">
            <option value="" disabled selected>Selecciona una cuenta</option>
            @for (c of cuentas(); track c.id) {
              <option [value]="c.id">{{ c.nombre }}{{ c.entidad ? ' · ' + c.entidad : '' }}</option>
            }
          </select>
        </div>
      }
      <div class="space-y-1">
        <label class="form-label">Notas</label>
        <textarea rows="2" [value]="formNotas()" (input)="formNotas.set($any($event.target).value)" class="form-input resize-none"></textarea>
      </div>
    </div>
    <div class="px-6 py-4 flex gap-3 justify-end" style="border-top:1px solid var(--border)">
      <button (click)="closed.emit()"
        class="px-4 py-2 text-sm rounded-lg transition-colors duration-150"
        style="border:1px solid var(--border);color:var(--text-muted)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''">
        Cancelar
      </button>
      <button (click)="submit()" [disabled]="saving() || !formConcepto().trim() || !formImporte() || !formCuentaId()"
        class="px-4 py-2 text-sm text-white rounded-lg transition-colors duration-150 disabled:opacity-50"
        style="background:var(--brand)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--brand-hover)'"
        (mouseleave)="$any($event.currentTarget).style.background='var(--brand)'">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </aside>
}
