@if (visible()) {
  <div class="fixed inset-0 z-40 bg-black/30" (click)="closed.emit()" aria-hidden="true"></div>
  <aside class="fixed right-0 top-0 h-full w-full max-w-sm bg-white shadow-2xl z-50 flex flex-col"
    role="dialog" aria-modal="true" aria-labelledby="mov-drawer-title">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
      <h2 id="mov-drawer-title" class="text-base font-semibold text-slate-800">Nuevo movimiento</h2>
      <button (click)="closed.emit()" class="p-1.5 rounded-lg hover:bg-slate-100" aria-label="Cerrar">
        <lucide-icon [img]="XIcon" class="w-4 h-4 text-slate-500" />
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-4">
      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-700">Concepto <span class="text-red-500">*</span></label>
        <input type="text" [value]="formConcepto()" (input)="formConcepto.set($any($event.target).value)"
          placeholder="Ej. Provisión de fondos"
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="text-sm font-medium text-slate-700">Tipo</label>
          <select (change)="onTipoChange($any($event.target).value)"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300">
            @for (t of tipos; track t) { <option [value]="t" [selected]="formTipo() === t">{{ t }}</option> }
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-sm font-medium text-slate-700">Importe (€) <span class="text-red-500">*</span></label>
          <input type="number" min="0" step="0.01" [value]="formImporte()" (input)="formImporte.set($any($event.target).value)"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="text-sm font-medium text-slate-700">Dirección</label>
          <select (change)="formEsEntrada.set($any($event.target).value === 'true')"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300">
            <option value="true" [selected]="formEsEntrada()">Entrada (cobrado)</option>
            <option value="false" [selected]="!formEsEntrada()">Salida (pagado)</option>
          </select>
        </div>
        <div class="space-y-1">
          <label class="text-sm font-medium text-slate-700">Fecha</label>
          <input type="date" [value]="formFecha()" (input)="formFecha.set($any($event.target).value)"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300" />
        </div>
      </div>
      @if (cuentas().length > 0) {
        <div class="space-y-1">
          <label class="text-sm font-medium text-slate-700">Cuenta / Caja</label>
          <select [value]="formCuentaId()" (change)="formCuentaId.set($any($event.target).value)"
            class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300">
            <option value="">Sin asignar</option>
            @for (c of cuentas(); track c.id) {
              <option [value]="c.id">{{ c.nombre }}{{ c.entidad ? ' · ' + c.entidad : '' }}</option>
            }
          </select>
        </div>
      }
      <div class="space-y-1">
        <label class="text-sm font-medium text-slate-700">Notas</label>
        <textarea rows="2" [value]="formNotas()" (input)="formNotas.set($any($event.target).value)"
          class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300 resize-none"></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-slate-200 flex gap-3 justify-end">
      <button (click)="closed.emit()"
        class="px-4 py-2 text-sm border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50">
        Cancelar
      </button>
      <button (click)="submit()" [disabled]="saving() || !formConcepto().trim() || !formImporte()"
        class="px-4 py-2 text-sm bg-violet-600 text-white rounded-lg hover:bg-violet-700 disabled:opacity-50">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </aside>
}
