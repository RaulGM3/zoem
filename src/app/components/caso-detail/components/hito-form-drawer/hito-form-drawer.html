<app-overlay-shell
  [open]="visible()"
  [title]="editingHito() ? 'Editar hito' : 'Nuevo hito'"
  variant="drawer"
  size="md"
  (closed)="closed.emit()"
>
  <div class="px-4 py-5 space-y-4 sm:px-6">
    <div class="space-y-1">
      <label class="form-label" for="hito-titulo">Título <span style="color:var(--danger)" aria-hidden="true">*</span></label>
      <input id="hito-titulo" type="text" required [value]="formTitulo()" (input)="formTitulo.set($any($event.target).value)" class="form-input" />
    </div>
    <div class="space-y-1">
      <label class="form-label" for="hito-descripcion">Descripción</label>
      <textarea id="hito-descripcion" rows="2" [value]="formDescripcion()" (input)="formDescripcion.set($any($event.target).value)" class="form-input resize-none"></textarea>
    </div>
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <div class="space-y-1">
        <label class="form-label" for="hito-estado">Estado</label>
        <select id="hito-estado" [value]="formEstado()" (change)="formEstado.set($any($event.target).value)" class="form-select">
          @for (e of estados; track e) { <option [value]="e">{{ estadoLabel[e] }}</option> }
        </select>
      </div>
      <div class="space-y-1">
        <label class="form-label" for="hito-fecha">Fecha estimada</label>
        <input id="hito-fecha" type="date" [value]="formFechaEstimada()" (input)="formFechaEstimada.set($any($event.target).value)" class="form-input" />
      </div>
    </div>
    <fieldset class="space-y-1">
      <legend class="form-label">Responsables</legend>
      <p class="text-xs" style="color:var(--text-faint)">Cada responsable podrá registrar sus horas por separado.</p>
      <div class="mt-1 space-y-1 rounded-lg p-2 max-h-40 overflow-y-auto" style="border:1px solid var(--border)">
        @for (m of members(); track m.id) {
          <label class="flex items-center gap-2 rounded px-1.5 py-1 text-sm cursor-pointer transition-colors duration-150 max-sm:min-h-11 hover:bg-[var(--surface-2)]"
            style="color:var(--text-body)">
            <input type="checkbox" [checked]="isAsignado(m.userId)" (change)="toggleAsignado(m.userId)" style="accent-color:var(--brand)" />
            {{ m.nombre }}{{ m.apellido ? ' ' + m.apellido : '' }}
          </label>
        } @empty {
          <p class="text-xs italic px-1.5 py-1" style="color:var(--text-faint)">No hay miembros en el despacho</p>
        }
      </div>
    </fieldset>
  </div>

  <div footer class="flex gap-3 px-4 py-4 sm:justify-end sm:px-6">
    <button type="button" (click)="closed.emit()"
      class="max-sm:tap-target max-sm:flex-1 px-4 py-2 text-sm rounded-lg transition-colors duration-150 hover:bg-[var(--surface-2)]"
      style="border:1px solid var(--border);color:var(--text-muted)">
      Cancelar
    </button>
    <button type="button" (click)="submit()" [disabled]="saving() || !formTitulo().trim()"
      class="max-sm:tap-target max-sm:flex-1 px-4 py-2 text-sm text-white rounded-lg transition-colors duration-150 bg-[var(--brand)] hover:bg-[var(--brand-hover)] disabled:opacity-50">
      {{ saving() ? 'Guardando...' : (editingHito() ? 'Guardar' : 'Añadir') }}
    </button>
  </div>
</app-overlay-shell>
