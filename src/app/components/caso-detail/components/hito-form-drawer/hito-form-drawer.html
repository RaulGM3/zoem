@if (visible()) {
  <div class="fixed inset-0 z-40 bg-black/30" (click)="closed.emit()" aria-hidden="true"></div>
  <aside class="fixed right-0 top-0 h-full w-full max-w-sm shadow-2xl z-50 flex flex-col" style="background:var(--surface)"
    role="dialog" aria-modal="true" aria-labelledby="hito-drawer-title">
    <div class="flex items-center justify-between px-6 py-4" style="border-bottom:1px solid var(--border)">
      <h2 id="hito-drawer-title" class="text-base font-semibold" style="color:var(--text-strong);font-family:var(--font-display)">
        {{ editingHito() ? 'Editar hito' : 'Nuevo hito' }}
      </h2>
      <button (click)="closed.emit()"
        class="p-1.5 rounded-lg transition-colors duration-150"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''"
        aria-label="Cerrar">
        <lucide-icon [img]="XIcon" class="w-4 h-4" style="color:var(--text-faint)" />
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-4">
      <div class="space-y-1">
        <label class="form-label">Título <span style="color:var(--danger)">*</span></label>
        <input type="text" [value]="formTitulo()" (input)="formTitulo.set($any($event.target).value)" class="form-input" />
      </div>
      <div class="space-y-1">
        <label class="form-label">Descripción</label>
        <textarea rows="2" [value]="formDescripcion()" (input)="formDescripcion.set($any($event.target).value)" class="form-input resize-none"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
          <label class="form-label">Estado</label>
          <select [value]="formEstado()" (change)="formEstado.set($any($event.target).value)" class="form-select">
            @for (e of estados; track e) { <option [value]="e">{{ estadoLabel[e] }}</option> }
          </select>
        </div>
        <div class="space-y-1">
          <label class="form-label">Fecha estimada</label>
          <input type="date" [value]="formFechaEstimada()" (input)="formFechaEstimada.set($any($event.target).value)" class="form-input" />
        </div>
      </div>
      <div class="space-y-1">
        <label class="form-label">Responsables</label>
        <p class="text-xs" style="color:var(--text-faint)">Cada responsable podrá registrar sus horas por separado.</p>
        <div class="mt-1 space-y-1 rounded-lg p-2 max-h-40 overflow-y-auto" style="border:1px solid var(--border)">
          @for (m of members(); track m.id) {
            <label class="flex items-center gap-2 rounded px-1.5 py-1 text-sm cursor-pointer transition-colors duration-150"
              style="color:var(--text-body)"
              (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
              (mouseleave)="$any($event.currentTarget).style.background=''">
              <input type="checkbox" [checked]="isAsignado(m.userId)" (change)="toggleAsignado(m.userId)" style="accent-color:var(--brand)" />
              {{ m.nombre }}{{ m.apellido ? ' ' + m.apellido : '' }}
            </label>
          } @empty {
            <p class="text-xs italic px-1.5 py-1" style="color:var(--text-faint)">No hay miembros en el despacho</p>
          }
        </div>
      </div>
    </div>
    <div class="px-6 py-4 flex gap-3 justify-end" style="border-top:1px solid var(--border)">
      <button (click)="closed.emit()"
        class="px-4 py-2 text-sm rounded-lg transition-colors duration-150"
        style="border:1px solid var(--border);color:var(--text-muted)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''">
        Cancelar
      </button>
      <button (click)="submit()" [disabled]="saving() || !formTitulo().trim()"
        class="px-4 py-2 text-sm text-white rounded-lg transition-colors duration-150 disabled:opacity-50"
        style="background:var(--brand)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--brand-hover)'"
        (mouseleave)="$any($event.currentTarget).style.background='var(--brand)'">
        {{ saving() ? 'Guardando...' : (editingHito() ? 'Guardar' : 'Añadir') }}
      </button>
    </div>
  </aside>
}
