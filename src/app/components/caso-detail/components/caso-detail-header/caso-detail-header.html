<div class="px-6 py-4 border-b border-slate-200 bg-white">
  <div class="flex items-start justify-between gap-4">
    <div class="flex items-start gap-3 min-w-0">
      <a
        routerLink="/casos"
        class="mt-0.5 p-1.5 rounded-lg hover:bg-slate-100 shrink-0"
        aria-label="Volver a casos"
      >
        <lucide-icon [img]="ArrowLeftIcon" class="w-4 h-4 text-slate-500" />
      </a>
      <div class="min-w-0">
        @if (!editing()) {
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-xl font-semibold text-slate-800 truncate">{{ titulo() }}</h1>
            <span [class]="'px-2 py-0.5 text-xs rounded-full font-medium ' + getEstadoClass(estado())">
              {{ estado() }}
            </span>
            <span [class]="'px-2 py-0.5 text-xs rounded-full font-medium ' + getTipoClass(tipo())">
              {{ tipo() }}
            </span>
          </div>
        }
      </div>
    </div>
    @if (!editing()) {
      <button
        (click)="edit.emit()"
        class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 text-sm border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50"
      >
        <lucide-icon [img]="Edit2Icon" class="w-3.5 h-3.5" />
        Editar
      </button>
    }
  </div>

  <!-- Tabs -->
  <nav class="flex gap-1 mt-4" role="tablist">
    @for (tab of tabs; track tab[0]) {
      <button
        role="tab"
        [attr.aria-selected]="activeTab() === tab[0]"
        [class]="activeTab() === tab[0]
          ? 'px-4 py-1.5 text-sm font-medium rounded-lg bg-violet-100 text-violet-700'
          : 'px-4 py-1.5 text-sm text-slate-500 rounded-lg hover:bg-slate-100'"
        (click)="tabChange.emit(tab[0])"
      >
        {{ tab[1] }}
        @if (tab[0] === 'hitos' && hitosCount() > 0) {
          <span class="ml-1.5 text-xs opacity-70">{{ hitosCount() }}</span>
        }
        @if (tab[0] === 'gestoria' && movimientosCount() > 0) {
          <span class="ml-1.5 text-xs opacity-70">{{ movimientosCount() }}</span>
        }
        @if (tab[0] === 'gestoria' && gestoriaPending() > 0) {
          <span class="ml-1.5 inline-flex items-center justify-center w-4 h-4 text-xs rounded-full bg-amber-400 text-white font-semibold">{{ gestoriaPending() }}</span>
        }
        @if (tab[0] === 'documentos' && docsPending() > 0) {
          <span class="ml-1.5 inline-flex items-center justify-center w-4 h-4 text-xs rounded-full bg-amber-400 text-white font-semibold">{{ docsPending() }}</span>
        }
      </button>
    }
  </nav>
</div>
