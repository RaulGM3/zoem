<div class="px-6 py-4" style="border-bottom:1px solid var(--border);background:var(--surface)">
  <div class="flex items-start justify-between gap-4">
    <div class="flex items-start gap-3 min-w-0">
      <a
        routerLink="/casos"
        class="mt-0.5 p-1.5 rounded-lg shrink-0 transition-colors duration-150"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''"
        aria-label="Volver a casos"
      >
        <lucide-icon [img]="ArrowLeftIcon" class="w-4 h-4" style="color:var(--text-faint)" />
      </a>
      <div class="min-w-0">
        @if (!editing()) {
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-xl font-semibold truncate" style="color:var(--text-strong);font-family:var(--font-display)">{{ titulo() }}</h1>
            <span class="px-2 py-0.5 text-xs rounded-full font-medium"
              [style.background]="getEstadoStyle(estado()).background"
              [style.color]="getEstadoStyle(estado()).color">
              {{ estado() }}
            </span>
            <span class="px-2 py-0.5 text-xs rounded-full font-medium"
              [style.background]="getTipoStyle(tipo()).background"
              [style.color]="getTipoStyle(tipo()).color">
              {{ tipo() }}
            </span>
          </div>
        }
      </div>
    </div>
    @if (!editing() && canEdit()) {
      <button
        (click)="edit.emit()"
        class="shrink-0 flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-lg transition-colors duration-150"
        style="border:1px solid var(--border);color:var(--text-muted)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
        (mouseleave)="$any($event.currentTarget).style.background=''"
      >
        <lucide-icon [img]="Edit2Icon" class="w-3.5 h-3.5" />
        Editar
      </button>
    }
  </div>

  <!-- Tabs -->
  <nav class="flex gap-1 mt-4" role="tablist">
    @for (tab of tabs; track tab[0]) {
      <button
        role="tab"
        [attr.aria-selected]="activeTab() === tab[0]"
        class="px-4 py-1.5 text-sm font-medium rounded-lg transition-colors duration-150"
        [style.background]="activeTab() === tab[0] ? 'color-mix(in srgb,var(--brand) 12%,transparent)' : ''"
        [style.color]="activeTab() === tab[0] ? 'var(--brand)' : 'var(--text-muted)'"
        (click)="tabChange.emit(tab[0])"
      >
        {{ tab[1] }}
        @if (tab[0] === 'hitos' && hitosCount() > 0) {
          <span class="ml-1.5 text-xs opacity-70">{{ hitosCount() }}</span>
        }
        @if (tab[0] === 'gestoria' && movimientosCount() > 0) {
          <span class="ml-1.5 text-xs opacity-70">{{ movimientosCount() }}</span>
        }
        @if (tab[0] === 'gestoria' && gestoriaPending() > 0) {
          <span class="ml-1.5 inline-flex items-center justify-center w-4 h-4 text-xs rounded-full font-semibold text-white" style="background:var(--warning)">{{ gestoriaPending() }}</span>
        }
        @if (tab[0] === 'documentos' && docsPending() > 0) {
          <span class="ml-1.5 inline-flex items-center justify-center w-4 h-4 text-xs rounded-full font-semibold text-white" style="background:var(--warning)">{{ docsPending() }}</span>
        }
      </button>
    }
  </nav>
</div>
