@if (loading()) {
  <div class="flex items-center justify-center h-64 text-sm" style="color:var(--text-faint)">Cargando caso...</div>
} @else if (!caso()) {
  <div class="flex flex-col items-center justify-center h-64 gap-2">
    <p style="color:var(--text-muted)">Caso no encontrado</p>
    <a routerLink="/casos" class="text-sm hover:underline" style="color:var(--brand)">Volver a casos</a>
  </div>
} @else {
  <div class="flex flex-col h-full">
    <app-caso-detail-header
      [titulo]="caso()!.titulo"
      [estado]="caso()!.estado"
      [tipo]="caso()!.tipo"
      [editing]="editingInfo()"
      [activeTab]="activeTab()"
      [hitosCount]="hitos().length"
      [movimientosCount]="gestoriaService.movimientos().length"
      [gestoriaPending]="gestoriaPending()"
      [docsPending]="docsPending()"
      (edit)="startEditInfo()"
      (tabChange)="setTab($event)"
    />

    <!-- Tab content -->
    <div class="flex-1 overflow-y-auto p-6">

      @if (activeTab() === 'info') {
        <app-caso-info-tab
          [caso]="caso()!"
          [editing]="editingInfo()"
          [saving]="savingInfo()"
          [linkedContacts]="linkedContacts()"
          [searchResults]="contactSearchResults()"
          [contactSearch]="contactSearch()"
          [noResults]="noContactResults()"
          (cancelEdit)="editingInfo.set(false)"
          (saveInfo)="onSaveInfo($event)"
          (searchChange)="contactSearch.set($event)"
          (addContact)="addContact($event)"
          (removeContact)="removeContact($event)"
        />
      }

      @if (activeTab() === 'hitos') {
        <app-caso-hitos-tab
          [hitos]="hitos()"
          [actividad]="actividad()"
          [members]="usersService.members()"
          [isAdmin]="permissionService.isAdmin()"
          (toggle)="toggleHitoEstado($event)"
          (editHito)="startEditHito($event)"
          (deleteHito)="deleteHito($event)"
          (addHito)="openNewHitoForm()"
          (facturarHoras)="facturarHorasHito($event)"
        />
      }

      @if (activeTab() === 'gestoria') {
        <app-caso-gestoria-tab
          [slots]="gestoriaService.slots()"
          [movimientos]="gestoriaService.movimientos()"
          [movimientosLoading]="gestoriaService.loading()"
          [resumen]="caso()!.resumenFinanciero"
          [miembros]="miembrosMap()"
          [cuentas]="cuentas()"
          (registerSlot)="openRegistrarSlot($event)"
          (unregisterSlot)="unregisterSlot($event)"
          (reorderSlots)="reorderSlots($event)"
          (addMov)="openMovForm()"
          (deleteMov)="deleteMovimiento($event)"
        />
      }

      @if (activeTab() === 'documentos') {
        <app-caso-documentos-tab
          [casoId]="caso()?.id ?? ''"
          [folders]="casoDocService.folders()"
          [slots]="casoDocService.slots()"
          [files]="casoDocService.files()"
          [loading]="casoDocService.isLoading()"
          [uploadingSlotId]="uploadingSlotId()"
          [busy]="docsBusy()"
          [progress]="docsProgress()"
          [casoContext]="casoDocContext()"
          (uploadSlot)="onUploadSlot($event)"
          (removeSlot)="onRemoveSlot($event)"
          (uploadFile)="onUploadFile($event)"
          (reuploadFile)="onReuploadFile($event)"
          (deleteFile)="onDeleteFile($event)"
          (createFolder)="onCreateFolder($event)"
          (deleteFolder)="onDeleteFolder($event)"
          (generateDoc)="onGenerateDoc($event)"
        />
      }

    </div>
  </div>
}

<app-hito-form-drawer
  [visible]="showHitoForm()"
  [saving]="savingHito()"
  [editingHito]="editingHito()"
  [members]="usersService.members()"
  (saved)="onSaveHito($event)"
  (closed)="showHitoForm.set(false)"
/>

<app-movimiento-form-drawer
  [visible]="showMovForm()"
  [saving]="savingMov()"
  [prefillSlot]="registeringSlot()"
  [cuentas]="cuentas()"
  (saved)="onSaveMov($event)"
  (closed)="closeMovForm()"
/>
