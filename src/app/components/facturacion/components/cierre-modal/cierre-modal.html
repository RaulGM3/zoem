<app-overlay-shell [open]="true" title="Cerrar caso" variant="modal" (closed)="closed.emit()">
<div class="space-y-4 p-5">
  <p class="text-sm" style="color:var(--text-body)">
    Vas a cerrar <span class="font-semibold" style="color:var(--text-strong)">{{ caso().titulo }}</span>. Confirma que la gestoría está
    revisada y cuadra con bancos antes de continuar. Esta acción lo mueve al archivo.
  </p>

  @if (!caso().facturaId) {
    <div class="rounded-lg p-3 text-xs" style="background:color-mix(in srgb,var(--warning) 10%,transparent);border:1px solid color-mix(in srgb,var(--warning) 25%,transparent);color:var(--warning)">
      Este caso aún no tiene factura generada. Puedes cerrarlo igualmente, pero se recomienda facturar antes.
    </div>
  }

  <label class="flex items-start gap-2 text-sm" style="color:var(--text-body)">
    <input type="checkbox" [checked]="movimientosOk()" (change)="movimientosOkChange.emit($any($event.target).checked)"
      class="mt-0.5 rounded" style="accent-color:var(--brand)" />
    Confirmo que todos los movimientos financieros están contemplados correctamente.
  </label>

  <label class="flex items-start gap-2 text-sm" style="color:var(--text-body)">
    <input type="checkbox" [checked]="bancoOk()" (change)="bancoOkChange.emit($any($event.target).checked)"
      class="mt-0.5 rounded" style="accent-color:var(--brand)" />
    <span>
      Confirmo que el saldo está corroborado en bancos.
      @if (saldoBancario() != null) {
        <span style="color:var(--text-faint)">(Saldo bancario: {{ saldoBancario() | number:'1.0-0' }}€)</span>
      } @else {
        <span style="color:var(--text-faint)">(Sin saldo bancario registrado — corroboración manual)</span>
      }
    </span>
  </label>
</div>

  <div footer class="flex gap-3 px-5 py-4">
    <button type="button" (click)="closed.emit()"
      class="tap-target flex-1 rounded-lg py-2.5 text-sm font-medium transition-colors duration-150 hover:bg-[var(--surface-2)]"
      style="border:1px solid var(--border);color:var(--text-body)">Cancelar</button>
    <button type="button" (click)="confirmed.emit()" [disabled]="!puedeCerrar() || saving()"
      class="tap-target flex-1 rounded-lg bg-[var(--brand)] py-2.5 text-sm font-semibold text-white transition-colors duration-150 hover:bg-[var(--brand-hover)] disabled:cursor-not-allowed disabled:opacity-50">
      {{ saving() ? 'Cerrando…' : 'Confirmar cierre' }}
    </button>
  </div>
</app-overlay-shell>
