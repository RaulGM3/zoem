<div class="lg:grid lg:grid-cols-[18rem_minmax(0,1fr)] lg:gap-6 lg:items-start">
  <nav aria-labelledby="config-titulo" [class]="seccionActiva() ? 'hidden lg:block' : 'block'">
    <h1 id="config-titulo" tabindex="-1" class="mb-4 text-2xl font-semibold outline-none" style="color:var(--text-strong)">Configuración</h1>
    <ul class="overflow-hidden rounded-xl" style="border:1px solid var(--border);background:var(--surface)">
      @for (s of secciones; track s.id) {
        <li class="[&:not(:last-child)]:border-b" style="border-color:var(--border)">
          <a [routerLink]="s.ruta" routerLinkActive="bg-[var(--surface-2)]" ariaCurrentWhenActive="page"
            class="flex items-center gap-3 px-4 py-3 transition-colors duration-150 hover:bg-[var(--surface-2)] max-sm:tap-target">
            <span class="flex size-9 shrink-0 items-center justify-center rounded-lg"
              style="background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)">
              <lucide-icon [img]="s.icon" class="size-4" aria-hidden="true"></lucide-icon>
            </span>
            <span class="min-w-0 flex-1">
              <span class="block text-sm font-semibold" style="color:var(--text-strong)">{{ s.label }}</span>
              <span class="block text-xs" style="color:var(--text-muted)">{{ s.descripcion }}</span>
            </span>
            <lucide-icon [img]="ChevronRightIcon" class="size-4 shrink-0 lg:hidden" style="color:var(--text-faint)" aria-hidden="true"></lucide-icon>
          </a>
        </li>
      }
    </ul>
  </nav>

  <section data-config-detalle [class]="seccionActiva() ? 'block min-w-0' : 'hidden min-w-0 lg:block'">
    @if (seccionActiva()) {
      <!-- En móvil el nav (con el h1) se oculta: mantenemos un h1 para lectores de pantalla -->
      <h1 class="sr-only lg:hidden">Configuración</h1>
      <a routerLink="/configuracion" data-config-volver
        class="mb-4 inline-flex items-center gap-1 text-sm font-medium lg:hidden max-sm:tap-target"
        style="color:var(--brand)">
        <lucide-icon [img]="ChevronLeftIcon" class="size-4" aria-hidden="true"></lucide-icon>
        Volver a Configuración
      </a>
    }
    <router-outlet />
  </section>
</div>
