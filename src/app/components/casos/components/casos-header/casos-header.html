<div class="flex items-center justify-between">
  <div class="flex items-center gap-3">
    <!-- Icon chip 40×40 Vertey -->
    <div class="flex h-10 w-10 items-center justify-center rounded-xl"
      style="background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning)">
      <lucide-icon [img]="BriefcaseIcon" class="w-5 h-5" />
    </div>
    <div>
      <h1 class="text-[19px] font-semibold" style="color:var(--text-strong);font-family:var(--font-display)">
        Gestión de Casos
      </h1>
      <p class="text-sm" style="color:var(--text-muted)">Seguimiento de expedientes y plazos</p>
    </div>
  </div>

  <div class="flex items-center gap-2">
    <a
      routerLink="/plantillas"
      class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-xl transition-colors duration-150"
      style="border:1px solid var(--border);color:var(--text-body);background:var(--surface)"
      (mouseenter)="$any($event.currentTarget).style.background='var(--surface-2)'"
      (mouseleave)="$any($event.currentTarget).style.background='var(--surface)'"
    >
      <lucide-icon [img]="LayersIcon" class="w-4 h-4" />
      Plantillas
    </a>
    @if (canCreate()) {
      <button
        (click)="newCasoClick.emit()"
        class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white rounded-xl transition-all duration-150"
        style="background:var(--brand)"
        (mouseenter)="$any($event.currentTarget).style.background='var(--brand-hover)'"
        (mouseleave)="$any($event.currentTarget).style.background='var(--brand)'"
      >
        <span class="material-symbols-outlined" style="font-size:16px">add</span>
        Nuevo caso
      </button>
    }
  </div>
</div>
