<div class="flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-3">
    <!-- Icon chip 40×40 Vertey -->
    <div class="flex h-10 w-10 items-center justify-center rounded-xl"
      style="background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--warning)">
      <lucide-icon [img]="BriefcaseIcon" class="w-5 h-5" />
    </div>
    <div>
      <h1 class="text-[19px] font-semibold" style="color:var(--text-strong);font-family:var(--font-display)">
        Gestión de Casos
      </h1>
      <p class="text-sm" style="color:var(--text-muted)">Seguimiento de expedientes y plazos</p>
    </div>
  </div>

  <div data-casos-acciones class="flex w-full items-center gap-2 sm:w-auto">
    <a
      routerLink="/plantillas"
      class="tap-target flex flex-1 items-center justify-center gap-2 px-3 py-2 sm:flex-none text-sm font-medium rounded-xl bg-[var(--surface)] transition-colors duration-150 hover:bg-[var(--surface-2)]"
      style="border:1px solid var(--border);color:var(--text-body)"
    >
      <lucide-icon [img]="LayersIcon" class="w-4 h-4" />
      Plantillas
    </a>
    @if (canCreate()) {
      <button
        (click)="newCasoClick.emit()"
        class="tap-target flex flex-1 items-center justify-center gap-2 px-4 py-2 sm:flex-none text-sm font-semibold text-white rounded-xl bg-[var(--brand)] transition-all duration-150 hover:bg-[var(--brand-hover)]"
      >
        <span class="material-symbols-outlined" style="font-size:16px">add</span>
        Nuevo caso
      </button>
    }
  </div>
</div>
