<div class="flex flex-wrap gap-3">
  <select
    [value]="filterEstado()"
    (change)="filterEstadoChange.emit($any($event.target).value)"
    class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300 text-slate-600"
    aria-label="Filtrar por estado"
  >
    <option value="">Todos los estados</option>
    @for (e of estados(); track e) {
      <option [value]="e">{{ e }}</option>
    }
  </select>
  <select
    [value]="filterTipo()"
    (change)="filterTipoChange.emit($any($event.target).value)"
    class="border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-300 text-slate-600"
    aria-label="Filtrar por tipo"
  >
    <option value="">Todos los tipos</option>
    @for (t of tipos(); track t) {
      <option [value]="t">{{ t }}</option>
    }
  </select>
</div>
