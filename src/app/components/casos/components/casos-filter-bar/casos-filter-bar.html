<div class="flex flex-wrap gap-3">
  <select
    [value]="filterEstado()"
    (change)="filterEstadoChange.emit($any($event.target).value)"
    class="rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 transition-colors duration-150"
    style="background:var(--surface);border:1px solid var(--border);color:var(--text-body);--tw-ring-color:color-mix(in srgb,var(--brand) 20%,transparent)"
    aria-label="Filtrar por estado"
  >
    <option value="">Todos los estados</option>
    @for (e of estados(); track e) {
      <option [value]="e">{{ e }}</option>
    }
  </select>

  <select
    [value]="filterTipo()"
    (change)="filterTipoChange.emit($any($event.target).value)"
    class="rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 transition-colors duration-150"
    style="background:var(--surface);border:1px solid var(--border);color:var(--text-body);--tw-ring-color:color-mix(in srgb,var(--brand) 20%,transparent)"
    aria-label="Filtrar por tipo"
  >
    <option value="">Todos los tipos</option>
    @for (t of tipos(); track t) {
      <option [value]="t">{{ t }}</option>
    }
  </select>
</div>
