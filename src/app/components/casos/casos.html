<div class="p-6 space-y-6">
  <app-casos-header (newCasoClick)="showDrawer.set(true)" />

  <app-casos-stats
    [total]="total()"
    [enProceso]="enProceso()"
    [pendientes]="pendientes()"
    [urgentes]="urgentes()"
  />

  <app-casos-filter-bar
    [search]="search()"
    [filterEstado]="filterEstado()"
    [filterTipo]="filterTipo()"
    [estados]="estados"
    [tipos]="tipos"
    (searchChange)="search.set($event)"
    (filterEstadoChange)="filterEstado.set($event)"
    (filterTipoChange)="filterTipo.set($event)"
  />

  <app-casos-table
    [casos]="filteredCasos()"
    [loading]="loading()"
    (casoClick)="navigateTo($event)"
    (deleteCaso)="onDeleteCaso($event)"
  />
</div>

<app-nuevo-caso-drawer
  [visible]="showDrawer()"
  [plantillas]="plantillas()"
  [saving]="saving()"
  (saved)="saveNuevoCaso($event)"
  (closed)="showDrawer.set(false)"
/>
