<div class="flex h-full flex-col gap-3">
  <div class="flex shrink-0 items-center justify-between">
    <h1 class="text-[22px] font-semibold" style="color:var(--text-strong);font-family:var(--font-display)">Calendario</h1>
    <button
      (click)="showDrawer.set(true)"
      class="flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold text-white transition-colors duration-150"
      style="background:var(--brand)"
      (mouseenter)="$any($event.currentTarget).style.background='var(--brand-hover)'"
      (mouseleave)="$any($event.currentTarget).style.background='var(--brand)'"
    >
      <lucide-icon [img]="PlusIcon" size="16"></lucide-icon>
      Nuevo evento
    </button>
  </div>

  <app-calendar-nav
    class="block shrink-0"
    [weekDays]="weekDays()"
    [monthDays]="monthDays()"
    [viewMode]="viewMode()"
    [weekMonthLabel]="weekMonthLabel()"
    [dayNames]="dayNames"
    (prevClicked)="prevWeek()"
    (nextClicked)="nextWeek()"
    (viewModeChanged)="setViewMode($event)"
    (dateToggled)="toggleDate($event)"
    (visibleDateChanged)="visibleMonthDate.set($event)"
    (moreDaysRequested)="stripDayCount.update(n => n + 7)"
  />

  @if (viewMode() !== 'month' || selectedDates().size > 0) {
    <app-day-schedule
      class="block min-h-0 flex-1"
      [groupedEvents]="groupedEvents()"
      [hasSelectedDates]="selectedDates().size > 0"
      [members]="members()"
      [visibleRangeStart]="currentWeekStart()"
      [visibleRangeCount]="stripDayCount()"
      (hitoStatusChanged)="updateHitoEstado($event)"
      (eventoStatusChanged)="updateEventoEstado($event)"
      (itemTimeChanged)="updateItemTime($event)"
      (itemColorChanged)="updateItemColor($event)"
      (registrosChanged)="updateRegistrosHoras($event)"
      (eventoDeleted)="onDeleteEvento($event)"
      (annotationAdded)="onAnnotationAdded($event)"
      (annotationDeleted)="onAnnotationDeleted($event)"
    />
  }
</div>

<app-nuevo-evento-drawer
  [visible]="showDrawer()"
  [saving]="saving()"
  (saved)="onSaveEvento($event)"
  (closed)="showDrawer.set(false)"
/>
