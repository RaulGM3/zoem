<div class="p-6 space-y-6">
  <app-plantillas-header (newPlantilla)="openNew()" />
  <app-plantillas-list
    [plantillas]="plantillasService.plantillas()"
    [loading]="plantillasService.loading()"
    (delete)="deletePlantilla($event)"
    (newPlantilla)="openNew()" />
</div>

@if (showForm()) {
  <app-plantilla-drawer
    [plantilla]="null"
    [members]="usersService.members()"
    [tipos]="tipos"
    [tiposCosto]="tiposCosto"
    (saved)="onDrawerClosed()"
    (closed)="onDrawerClosed()" />
}
